<template id="employeesViewTemplate">
  <section id="view-employees" class="view">
    <div class="content-grid">
      <form class="section-card employee-entry-card" id="employeeForm">
        <div class="card-head">
          <div class="card-title-group">
            <h3 class="card-title">Employee Module</h3>
            <span class="pill" id="employeeCountPill">0 Employees</span>
          </div>
          <div class="card-actions">
            <button class="light-btn compact-btn" type="button" data-action="reset-employee-form">Clear</button>
            <button class="action-btn" id="employeeSubmitBtn" type="submit">Save Employee</button>
          </div>
        </div>

        <div class="employee-form-grid">
          <label class="form-field">
            <span>Employee ID</span>
            <input id="employeeId" type="text" placeholder="Leave blank for TEMP ID">
          </label>
          <label class="form-field">
            <span>Employee Name</span>
            <input id="employeeName" type="text" placeholder="Full name" required>
          </label>
          <label class="form-field">
            <span>Reporting Branch</span>
            <select id="employeeBranch">
              <option value="">Select Branch</option>
            </select>
          </label>
          <label class="form-field">
            <span>Office</span>
            <select id="employeeOffice">
              <option value="">Select Office</option>
            </select>
          </label>
          <div class="employee-form-note" id="employeeFormStatus"></div>
        </div>
      </form>

      <div class="toolbar employee-toolbar">
        <div class="search-box">
          <span class="search-prefix">Search</span>
          <input id="employeeSearch" type="text" placeholder="Search employee ID, name, branch, office...">
        </div>

        <div class="filter-box">
          <select id="employeeActiveFilter">
            <option value="">All Employees</option>
            <option value="Yes">Active</option>
            <option value="No">Inactive</option>
            <option value="Resigned">Resigned</option>
          </select>
        </div>
      </div>

      <div class="section-card">
        <div class="card-head">
          <div class="card-title-group">
            <h3 class="card-title">Employees</h3>
          </div>
          <div id="employeeTableMeta">Loading employees...</div>
        </div>

        <div class="table-wrap">
          <table class="app-table employee-table">
            <thead>
              <tr>
                <th>Employee ID</th>
                <th>Employee Name</th>
                <th>Reporting Branch</th>
                <th>Office</th>
                <th>Active</th>
                <th>ID Source</th>
                <th>Updated At</th>
                <th>Edit</th>
              </tr>
            </thead>
            <tbody id="employeeTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>
</template>
